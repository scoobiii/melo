# Localização no repo: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores do mesmo PR/branch quando um novo push chega,
# evita gastar minutos de CI em commits já superados.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar ferramentas de lint
        run: pip install ruff --break-system-packages

      - name: Rodar ruff
        run: ruff check packages/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements/base.txt --break-system-packages
          pip install -r requirements/test.txt --break-system-packages
          pip install pytest-cov --break-system-packages

      - name: Rodar suíte de testes com cobertura
        env:
          # testes de IA usam mock de requests.post, nunca chamam a API
          # real em CI; adapter usa requests puro (sem SDK anthropic)
          ANTHROPIC_API_KEY: "test-key-unused-mocked"
        run: pytest tests/ --cov=packages --cov-report=xml --cov-report=term

      - name: Upload de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  build-image:
    runs-on: ubuntu-latest
    needs: test
    # só builda/publica imagem em push para main, não em PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push, só validação de build)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: melo:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
